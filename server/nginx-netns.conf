load_module /usr/lib/nginx/modules/ngx_http_echo_module.so;

worker_processes  1;

pid /home/doogunwo/training/Mini-IPS/server/nginx-netns.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    access_log /dev/stdout;
    error_log  /dev/stderr info;
    client_max_body_size 32m;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;

        root /home/doogunwo/training/Mini-IPS/server;
        index index.json;

        location = /mini-ips-logo.png {
            alias /home/doogunwo/training/Mini-IPS/ips/image/image.png;
            default_type image/png;
        }

        location / {
            try_files $uri $uri/ /index.json;
        }
    }
}
